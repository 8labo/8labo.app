<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>８LABO</title>
  <meta name="description" content="８LABO 共通WEBアプリ">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:#111827;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:40px;box-shadow:0 14px 40px rgba(0,0,0,.06)}.brand{font-size:34px;font-weight:800;letter-spacing:.02em;margin:0 0 12px}.lead{font-size:18px;line-height:1.8;margin:0 0 28px;color:#4b5563}.status{display:inline-flex;padding:8px 12px;border-radius:999px;background:#eef2f7;font-size:13px;font-weight:700;color:#4b5563}.note{margin-top:24px;font-size:13px;line-height:1.7;color:#6b7280}</style>
</head>
<body>
  <main class="card">
    <div class="status">準備中</div>
    <h1 class="brand">８LABO</h1>
    <p class="lead">スポーツ・健康・学びを、地域の日常へ。</p>
    <p class="note">８LABO共通WEBアプリの本番環境です。現在、新しい共通基盤へのリニューアルを進めています。</p>
  </main>
</body>
</html>
